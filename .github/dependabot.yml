# Updates for npm dependencies and pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The Wrangler that deploys the website: a standalone pnpm project with its own lockfile
  # (website/README.md, "Deployment"), which the root entry doesn't cover
  - package-ecosystem: npm
    directory: /website/deploy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
