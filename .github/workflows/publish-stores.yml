name: Publish to stores

# Started by hand (docs/store-publishing.md). Submits the packages of a published GitHub release to the
# Chrome Web Store and Firefox Add-ons; nothing is rebuilt. The first job downloads and verifies the
# release's files without any secret. Each store job runs in its own environment (`store-chrome`,
# `store-firefox`) that accepts deployments from `main` only, so a workflow edited on another branch
# can't reach the store credentials. Without `submit`, a run only verifies.
#
# The store jobs install nothing: scripts/publish-stores.ts imports only Node built-ins and release
# scripts that do the same, so dependency code can't reach the credentials.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version, without the leading v
        required: true
        type: string
      submit:
        description: Submit to the selected stores (off, the run only downloads and verifies)
        required: true
        default: false
        type: boolean
      chrome:
        description: Chrome Web Store
        required: true
        default: true
        type: boolean
      firefox:
        description: Firefox Add-ons
        required: true
        default: true
        type: boolean
      chrome_publish_type:
        description: Chrome Web Store, once its review passes
        required: true
        default: publish-after-review
        type: choice
        options:
          - publish-after-review
          - stage-for-manual-publish

permissions: {}

concurrency:
  group: publish-stores
  cancel-in-progress: false

jobs:
  verify:
    name: Download and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SUBMIT_CHROME: ${{ inputs.chrome }}
      SUBMIT_FIREFOX: ${{ inputs.firefox }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag has to be part of origin/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the request and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "The version must be two to four numbers separated by dots, without a leading v." >&2
            exit 1
          fi
          if [[ "$SUBMIT_CHROME" != "true" && "$SUBMIT_FIREFOX" != "true" ]]; then
            echo "Select at least one store." >&2
            exit 1
          fi
          # Catches a wrong selection only: the environments' branch rule is the boundary
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main." >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Release $tag must exist and be published, not a draft." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main; then
            echo "Tag $tag must point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Download the release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .output
          gh release download "v$RELEASE_VERSION" --dir .output
          (cd .output && sha256sum --check --strict SHA256SUMS.txt)

      - name: Verify the packages
        run: node scripts/publish-stores.ts verify "$RELEASE_VERSION"

      - name: Hand the packages to the store jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          # The CRX is there only when the release was signed
          path: |
            .output/ntfy-desk-${{ inputs.version }}-chrome.zip
            .output/ntfy-desk-${{ inputs.version }}-chrome.crx
            .output/ntfy-desk-${{ inputs.version }}-firefox.zip
            .output/ntfy-desk-${{ inputs.version }}-sources.zip
          # .output is a hidden folder: without this the action finds no files
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  chrome:
    name: Submit to the Chrome Web Store
    needs: verify
    if: inputs.submit && inputs.chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: store-chrome
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: .output

      # Verifies the packages again, then uploads the CRX when signing is on, else the Chromium ZIP
      - name: Upload and submit for review
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISH_TYPE: ${{ inputs.chrome_publish_type }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/publish-stores.ts chrome "$RELEASE_VERSION"

  firefox:
    name: Submit to Firefox Add-ons
    needs: verify
    if: inputs.submit && inputs.firefox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: store-firefox
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: .output

      - name: Upload and submit for review
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish-stores.ts firefox "$RELEASE_VERSION"
