name: Prepare release

# Started by hand (docs/releasing.md). The first job builds and checks the packages without any
# secret. The second job runs in the `release` environment: it checks the downloaded packages again,
# signs the Chromium ZIP when a signing key is registered (docs/crx-signing.md) and creates or
# refreshes a draft GitHub release. Publishing the draft and every store upload stay manual.
#
# This file can be edited on any branch, so its "part of origin/main" check only catches a wrong
# selection. The boundary for the signing key is the environment (main only, required reviewer).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the checks below need origin/main and the existing tags
          fetch-depth: 0
          persist-credentials: false
      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No dependency cache: a release build installs from the registry and the lockfile only
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the release request
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "The version must be two to four numbers separated by dots, without a leading v." >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Requested version $RELEASE_VERSION, but package.json has $package_version. Bump the version in its own commit first." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected commit must be part of origin/main." >&2
            exit 1
          fi
          # A tag exists once a release is published: that version is taken
          if git rev-parse --quiet --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Tag v$RELEASE_VERSION already exists: this version is released. Bump the version." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The same gate as CI: format, lint with type checking, unit tests; end-to-end tests; Mozilla's checks
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --fail-on-flaky-tests
      - run: pnpm lint:firefox

      - name: Build the packages
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Validate the packages
        run: pnpm verify:packages

      - name: Upload unsigned packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-packages
          path: .output/ntfy-desk-${{ inputs.version }}-*.zip
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 3

  sign:
    name: Sign and create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}

    # Nothing here installs packages or runs build tooling: the scripts import only Node built-ins
    # and run from a fresh checkout, so dependency code from the first job cannot reach the key
    # or the write token.
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Recheck the release target
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ || "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match package.json version $package_version." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected commit must be part of origin/main." >&2
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Tag v$RELEASE_VERSION already exists: this version is released. Bump the version." >&2
            exit 1
          fi

      - name: Download unsigned packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-packages
          path: .output

      - name: Revalidate the downloaded packages
        run: node scripts/validate-packages.ts

      # Signs only when the public key is committed; then a missing or different secret fails the run.
      # Without the public key it reports "skipped" in the summary and the draft gets the ZIPs only.
      - name: Sign the Chromium package for verified uploads
        id: sign
        env:
          NTFY_DESK_CRX_PRIVATE_KEY: ${{ secrets.NTFY_DESK_CRX_PRIVATE_KEY }}
        run: node scripts/sign-chrome.ts

      - name: Verify the signed package without the key
        if: steps.sign.outputs.signed == 'true'
        run: node scripts/sign-chrome.ts --verify

      - name: Create checksums
        shell: bash
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          cd .output
          expected=(
            "ntfy-desk-${RELEASE_VERSION}-chrome.zip"
            "ntfy-desk-${RELEASE_VERSION}-firefox.zip"
            "ntfy-desk-${RELEASE_VERSION}-sources.zip"
          )
          if [[ "$SIGNED" == "true" ]]; then
            expected+=("ntfy-desk-${RELEASE_VERSION}-chrome.crx")
          fi
          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Expected release file is missing: $file" >&2
              exit 1
            fi
          done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Releases are addressed by id, never looked up by tag: a draft has no tag yet, and several
      # drafts can name the same one.
      - name: Create or refresh the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"
          api="repos/$GITHUB_REPOSITORY/releases"

          # --slurp gives one array of pages: one object per release of this tag
          gh api --paginate --slurp "$api?per_page=100" \
            | jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag) | {id, draft, name}]' > "$RUNNER_TEMP/existing.json"
          count="$(jq 'length' "$RUNNER_TEMP/existing.json")"

          if [[ "$count" -gt 1 ]]; then
            echo "$count releases name the tag $tag. Delete the extra drafts, then run again." >&2
            exit 1
          fi
          if [[ "$count" -eq 1 ]]; then
            if [[ "$(jq -r '.[0].draft' "$RUNNER_TEMP/existing.json")" != "true" ]]; then
              echo "Release $tag is already published. Bump the version." >&2
              exit 1
            fi
            # An existing draft keeps its title and notes: only the commit, the prerelease flag and the files change
            release_id="$(jq -r '.[0].id' "$RUNNER_TEMP/existing.json")"
            gh api --method PATCH "$api/$release_id" \
              -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease="$PRERELEASE" --silent
            gh api --paginate "$api/$release_id/assets?per_page=100" --jq '.[].id' | while read -r asset_id; do
              gh api --method DELETE "$api/assets/$asset_id" --silent
            done
            state="Refreshed the existing draft (title and notes kept, files replaced)"
          else
            release_id="$(gh api --method POST "$api" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="ntfy Desk $tag" \
              -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true --jq '.id')"
            state="Created a draft with generated notes"
          fi

          upload() {
            local file="$1" type="$2" label="$3" query
            query="$(jq -rn --arg name "$file" --arg label "$label" '"name=\($name | @uri)&label=\($label | @uri)"')"
            gh api --method POST -H "Content-Type: $type" \
              "https://uploads.github.com/$api/$release_id/assets?$query" --input ".output/$file" --silent
          }
          upload "ntfy-desk-${RELEASE_VERSION}-chrome.zip" application/zip "Chromium extension (ZIP)"
          if [[ "$SIGNED" == "true" ]]; then
            upload "ntfy-desk-${RELEASE_VERSION}-chrome.crx" application/x-chrome-extension "Signed CRX for Chrome Web Store verified uploads"
          fi
          upload "ntfy-desk-${RELEASE_VERSION}-firefox.zip" application/zip "Firefox add-on (ZIP)"
          upload "ntfy-desk-${RELEASE_VERSION}-sources.zip" application/zip "Source code for Firefox Add-ons review (ZIP)"
          upload SHA256SUMS.txt text/plain "SHA-256 checksums"

          {
            echo "### Draft release $tag"
            echo
            echo "$state, at commit \`$GITHUB_SHA\`."
            echo
            echo "Download and test its packages, then publish the draft by hand (docs/releasing.md)."
            echo
            gh api "$api/$release_id" --jq '.html_url'
          } >> "$GITHUB_STEP_SUMMARY"
