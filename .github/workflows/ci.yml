name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint with type checking (Vite+), tests
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm zip:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: ntfy-desk
          path: .output/*.zip

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's own Chromium: branded Chrome doesn't load unpacked extensions from the command line
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ntfy-desk
      - uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          generate_release_notes: true
