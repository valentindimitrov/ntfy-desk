name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here publishes. Releases are prepared by prepare-release.yml, started by hand;
# the tag a published release creates starts no workflow. Actions are pinned to commits, so a moved
# tag can't change what runs; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint with type checking (Vite+), tests
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm zip:firefox
      # Manifests, license notices, no stray files or E2E hooks, sources identical to this commit
      - name: Validate the release packages
        run: pnpm verify:packages
      # Mozilla's add-on checks on the Firefox build
      - run: pnpm exec web-ext lint -s .output/firefox-mv3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntfy-desk
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's own Chromium: branded Chrome doesn't load unpacked extensions from the command line
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
