name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write (it publishes the release). Actions are pinned
# to commits, so a moved tag can't change what runs; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release tag against package version
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== "v" + version) {
              console.error("The release tag must be v" + version);
              process.exitCode = 1;
            }
          '
      # Format, lint with type checking (Vite+), tests
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm zip:firefox
      - name: Verify release ZIPs and license notices
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          for browser in chrome firefox; do
            archive=".output/ntfy-desk-${version}-${browser}.zip"
            unzip -tq "$archive"
            unzip -p "$archive" LICENSE | cmp - LICENSE
            unzip -p "$archive" NOTICE.md | cmp - NOTICE.md
            unzip -p "$archive" fonts/LICENSE.txt | cmp - public/fonts/LICENSE.txt
          done
          source=".output/ntfy-desk-${version}-sources.zip"
          unzip -tq "$source"
          for file in LICENSE NOTICE.md public/fonts/LICENSE.txt README.md PRIVACY.md; do
            unzip -p "$source" "$file" | cmp - "$file"
          done
      # Mozilla's add-on checks on the Firefox build
      - run: pnpm exec web-ext lint -s .output/firefox-mv3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntfy-desk
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's own Chromium: branded Chrome doesn't load unpacked extensions from the command line
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ntfy-desk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: '*.zip'
          fail_on_unmatched_files: true
          generate_release_notes: true
