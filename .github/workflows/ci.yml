name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: no job writes to the repository. The website job deploys the site once its variable
# is set, with a token of its own environment. Releases are prepared by prepare-release.yml, started by hand;
# the tag a published release creates starts no workflow. Actions are pinned to commits, so a moved
# tag can't change what runs; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint with type checking (Vite+), tests
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm zip:firefox
      # Manifests, license notices, no stray files or E2E hooks, sources identical to this commit
      - name: Validate the release packages
        run: pnpm verify:packages
      # Mozilla's add-on checks on the Firefox build
      - run: pnpm exec web-ext lint -s .output/firefox-mv3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntfy-desk
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
      # The website (website/README.md): static files, built here without secrets. The website job
      # below publishes this artifact as it is, without installing or running anything from it; for a pull
      # request, website-preview.yml (started when this workflow completes) uploads it as a preview.
      - run: pnpm website:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: .output/website/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's own Chromium: branded Chrome doesn't load unpacked extensions from the command line
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # Publishes the website built by the check job to https://ntfy-desk.minddevops.eu, on pushes to
  # main only. Skipped until the CLOUDFLARE_ACCOUNT_ID variable is set. On a push to main this
  # workflow file, the build and this job's checkout are all main's, so the token meets only code
  # already merged to main. Keep the token as a secret of the production environment, limited to
  # main: a pull request run is then refused it (website/README.md).
  website:
    needs: check
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ntfy-desk.minddevops.eu
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Only the deployment configuration and the locked Wrangler: none of the extension's code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            website/wrangler.jsonc
            website/deploy
          sparse-checkout-cone-mode: false
      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked Wrangler only
        working-directory: website/deploy
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: .output/website
      - name: Deploy to production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: website/deploy/node_modules/.bin/wrangler deploy --config website/wrangler.jsonc
